name: "Unittests"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the Unit Tests
        run: |
          uv run --group tests pytest
  codegen:
    # the codegen consistency test is skipped in the jobs above (they don't install the codegen group)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Check that models/v2/_generated.py matches the pinned OpenAPI spec
        run: |
          uv run --group codegen pytest unittests/test_v2_codegen.py -rs
