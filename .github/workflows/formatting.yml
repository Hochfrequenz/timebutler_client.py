name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # Matrix values are kept as "black"/"isort" even though both now run ruff,
  # because "format (black)" / "format (isort)" are required status checks
  # in this repo's branch ruleset - renaming them would leave those required
  # checks permanently pending. Rename together with the ruleset if desired.
  format:
    name: "format (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: uv run --group linting ruff format --check .
          - tool: isort
            command: uv run --group linting ruff check --select I .
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - name: ${{ matrix.tool }} Code Formatter
        run: ${{ matrix.command }}
