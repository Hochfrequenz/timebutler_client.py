[project]
name = "timebutler_client"
description = "Async Python client for the Timebutler API"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["timebutler", "api", "client", "async", "aiohttp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.10",
    "pydantic>=2.5",
]
dynamic = ["readme", "version"]

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aioresponses==0.7.9",
    "aiohttp<3.14", # aioresponses 0.7.x mocks aiohttp internals incompatible with 3.14's ClientResponse signature
]
linting = [
    "ruff==0.16.1",
    { include-group = "tests" },
]
type_check = [
    "mypy==2.3.0",
    { include-group = "tests" },
]
spell_check = [
    "codespell==2.4.3"
]
coverage = [
    "coverage==7.15.4",
    { include-group = "tests" },
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    { include-group = "spell_check" },
    "pre-commit",
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/timebutler_client.py/releases"
Homepage = "https://github.com/Hochfrequenz/timebutler_client.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "N",   # pep8-naming
  "PL",  # pylint
  "RUF", # ruff-specific rules
]
ignore = [
  "PLR0913", # too-many-arguments - not enforced under the old pylint config either
  "PLR0917", # too-many-positional-arguments
  "PLR0912", # too-many-branches
  "PLR0915", # too-many-statements
  "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.per-file-ignores]
# these files embed long CSV fixture strings (some as interior lines of a
# triple-quoted literal, where a trailing noqa comment isn't possible at
# all without corrupting the fixture content); same intent as the removed
# `# pylint: disable=line-too-long` / `enable=line-too-long` block pairs
"unittests/test_absences.py" = ["E501"]
"unittests/test_users.py" = ["E501"]
"unittests/test_workdays.py" = ["E501"]
"unittests/test_worktime.py" = ["E501"]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_timebutler_client_version.py"
template = '''
version = "{version}"
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
